[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PL", "RUF"]
ignore = ["PLR2004", "RUF012", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
